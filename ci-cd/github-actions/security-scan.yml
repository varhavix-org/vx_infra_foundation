# =======================================================================
# Reusable CI/CD Workflow — Security Scanning
# =======================================================================
name: Security Scan

on:
  workflow_call:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
