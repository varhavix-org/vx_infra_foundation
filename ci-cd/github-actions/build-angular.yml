# =======================================================================
# Reusable CI/CD Workflow — Angular UI
# =======================================================================
name: Build Angular UI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      artifact-name:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build -- --configuration=production

      - name: Build Docker Image
        run: |
          docker build \
            -f ../vx_infra_foundation/docker/templates/Dockerfile.angular \
            -t ghcr.io/varhavix-org/${{ inputs.artifact-name }}:${{ github.sha }} \
            .
