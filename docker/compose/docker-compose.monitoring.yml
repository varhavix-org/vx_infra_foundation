# =======================================================================
# VarhaviX Monitoring Stack — Prometheus + Grafana
# =======================================================================
version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: varhavix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - varhavix-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: varhavix-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - varhavix-net

volumes:
  grafana_data:

networks:
  varhavix-net:
    external: true
