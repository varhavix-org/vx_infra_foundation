apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: varhavix

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - target:
      kind: Deployment
      labelSelector: "tier=api"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      labelSelector: "tier=ui"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
