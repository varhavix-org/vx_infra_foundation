apiVersion: apps/v1
kind: Deployment
metadata:
  name: vx-lms-ui
  namespace: varhavix
  labels:
    app: vx-lms-ui
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vx-lms-ui
  template:
    metadata:
      labels:
        app: vx-lms-ui
        tier: ui
    spec:
      containers:
        - name: vx-lms-ui
          image: varhavix/vx-lms-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vx-lms-ui
  namespace: varhavix
spec:
  selector:
    app: vx-lms-ui
  ports:
    - port: 80
      targetPort: 80
