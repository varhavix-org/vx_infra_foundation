# =======================================================================
# VarhaviX Enterprise Infrastructure — ALL Apps Docker Compose
# =======================================================================
version: "3.9"

x-api-common: &api-common
  restart: unless-stopped
  networks:
    - varhavix-net
  depends_on:
    varhavix-postgres:
      condition: service_healthy

services:
  # ────────── Infrastructure ──────────
  varhavix-postgres:
    image: postgres:16-alpine
    container_name: varhavix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - varhavix-net

  varhavix-redis:
    image: redis:7-alpine
    container_name: varhavix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - varhavix-net

  # ────────── Backend APIs ──────────
  vx-landing-api:
    <<: *api-common
    build:
      context: ../vx_app_landing_api
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.api
    container_name: vx-landing-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://varhavix-postgres:5432/varhavix_landing_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  vx-mind-mapper-api:
    <<: *api-common
    build:
      context: ../vx_app_mind_mapper_api
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.api
    container_name: vx-mind-mapper-api
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://varhavix-postgres:5432/varhavix_mind_mapper_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  vx-admin-api:
    <<: *api-common
    build:
      context: ../vx_app_admin_api
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.api
    container_name: vx-admin-api
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://varhavix-postgres:5432/varhavix_admin_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  vx-mentor-api:
    <<: *api-common
    build:
      context: ../vx_app_mentor_api
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.api
    container_name: vx-mentor-api
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://varhavix-postgres:5432/varhavix_mentor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  vx-media-api:
    <<: *api-common
    build:
      context: ../vx_app_media_api
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.api
    container_name: vx-media-api
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://varhavix-postgres:5432/varhavix_media_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  # ────────── Frontend UIs ──────────
  vx-landing-ui:
    build:
      context: ../vx_app_landing_ui
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.ui
    container_name: vx-landing-ui
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - varhavix-net

  vx-admin-ui:
    build:
      context: ../vx_app_admin_ui
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.ui
    container_name: vx-admin-ui
    restart: unless-stopped
    ports:
      - "4201:80"
    networks:
      - varhavix-net

  vx-mentor-ui:
    build:
      context: ../vx_app_mentor_ui
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.ui
    container_name: vx-mentor-ui
    restart: unless-stopped
    ports:
      - "4202:80"
    networks:
      - varhavix-net

  vx-mind-mapper-ui:
    build:
      context: ../vx_app_mind_mapper_ui
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.ui
    container_name: vx-mind-mapper-ui
    restart: unless-stopped
    ports:
      - "4203:80"
    networks:
      - varhavix-net

  vx-media-ui:
    build:
      context: ../vx_app_media_ui
      dockerfile: ../vx_infra_foundation/docker/Dockerfile.ui
    container_name: vx-media-ui
    restart: unless-stopped
    ports:
      - "4204:80"
    networks:
      - varhavix-net

  # ────────── Gateway ──────────
  vx-gateway:
    image: nginx:1.27-alpine
    container_name: vx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../vx_core_application_composition/nginx.orchestrator.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - vx-landing-api
      - vx-landing-ui
    networks:
      - varhavix-net

volumes:
  pg_data:

networks:
  varhavix-net:
    driver: bridge
